[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindclassify"
version = "0.1.0"
description = "QLoRA-tuned Llama 3.1 for mental-health text classification"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
llm = ["torch>=2.1", "transformers>=4.43", "peft>=0.11", "accelerate>=0.30", "bitsandbytes>=0.43"]
dev = ["pytest>=8"]

[project.scripts]
mindclassify = "mindclassify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
